<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><meta name=robots content='noindex,nofollow'><title>これまでの日 マイライフ</title><style>
:root{--bg:#f6f4ef;--fg:#222;--card:#fff;--muted:#666;--line:#ddd;--acc:#2B5D67;--on:#1f7a4d;--onbg:#e3f4ea;--off:#666;--offbg:#eceae4;--warn:#b3261e;--warnbg:#fde7e4}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,'Hiragino Sans','Yu Gothic UI',sans-serif;line-height:1.6;font-size:16px}

.t.off{background:var(--offbg);border-color:transparent}.t.off .b{color:var(--off)}

ul{padding-left:1.2em;margin:6px 0}li{margin:4px 0;overflow-wrap:anywhere}
.warn{color:var(--warn);font-weight:700}.mut{color:var(--muted);font-size:13px}

.wk .d{flex:none;width:5.6em;font-weight:700}
